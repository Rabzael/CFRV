baseURL = 'https://www.sanremigioverona.org/'
defaultContentLanguage = 'it'
theme = 'alpha-church'

[languages]
  [languages.it]
    disabled = false
    weight = 0
    languageCode = 'it-IT'
    languageName = 'Italiano'
    title = 'CFRV'

[security]
  enableInlineShortcodes = true

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "Orari"
    url = "/orari"
    weight = 2

  [[menu.main]]
    name = "Chi siamo"
    url = "/presentazione"
    weight = 3

  [[menu.main]]
